<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b3043"><meta name="description" content="DOMANDO RUSH WORLD FESTIVAL — 広い冒険世界と本格4ジャンル。PC・スマホ対応。">
<title>DOMANDO RUSH 6.0 | LUMINOUS ATLAS</title>
<link rel="manifest" href="./static/manifest.webmanifest">
<link rel="icon" href="./static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./static/style.css?v=6.0.0">
</head>
<body>
<div id="shell">
  <div id="stage"><canvas id="game" width="960" height="600" aria-label="DOMANDO RUSH 6.0。キーボードか画面のボタンで冒険するゲーム"></canvas>
    <div id="notice" role="status" aria-live="polite"></div>
  </div>
  <div id="orientation-hint">📱 横向きにすると、広い世界をもっと遊びやすく表示できます</div>
  <div id="touch" aria-label="スマホ操作ボタン">
    <div class="pad" aria-label="移動キー"><button data-key="arrowup" class="up" aria-label="上に移動">▲</button><button data-key="arrowleft" class="left" aria-label="左に移動">◀</button><button data-key="arrowdown" class="down" aria-label="下に移動">▼</button><button data-key="arrowright" class="right" aria-label="右に移動">▶</button></div>
    <div class="action-pad"><button id="button-b" data-key="shift">B <small id="actB">走る</small></button><button id="button-a" data-key=" ">A <small id="actA">調べる</small></button></div>
  </div>
</div>
<div id="error" hidden></div>
<script src="./static/game.js?v=6.0.0" defer></script>

</body>
</html>
