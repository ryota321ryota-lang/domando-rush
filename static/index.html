<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#243c58"><meta name="description" content="DOMANDO RUSH FOUR ROADS — RPGの町から4ジャンルの冒険へ出かける、オリジナルひとり用ゲーム">
<title>DOMANDO RUSH 4.0 | FOUR ROADS</title>
<link rel="stylesheet" href="/static/style.css?v=4.0.0">
</head>
<body>
<div id="shell">
  <div id="stage"><canvas id="game" width="960" height="600" aria-label="ドマンド・ラッシュのゲーム画面"></canvas>
    <div id="notice" role="status" aria-live="polite"></div>
  </div>
  <div id="touch" aria-label="スマホ操作ボタン">
    <div class="pad" aria-label="移動キー"><button data-key="arrowup" class="up">▲</button><button data-key="arrowleft" class="left">◀</button><button data-key="arrowdown" class="down">▼</button><button data-key="arrowright" class="right">▶</button></div>
    <div class="action-pad"><button id="button-b" data-key="shift">B <small id="actB">ダッシュ</small></button><button id="button-a" data-key=" ">A <small id="actA">決定</small></button></div>
  </div>
</div>
<div id="error" hidden></div>
<script src="/static/game.js?v=4.0.0" defer></script>
</body>
</html>
